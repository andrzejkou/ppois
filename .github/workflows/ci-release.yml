
name: CI and Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "lab1-v*"

permissions:
  contents: read

jobs:
  lab1-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cppcheck gcovr

      - name: Run unit tests
        run: make -C lab1 test

      - name: Check test coverage
        run: make -C lab1 coverage

      - name: Static analysis
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --language=c++ \
            --std=c++17 \
            --suppress=missingIncludeSystem \
            -I lab1 \
            lab1/main.cpp \
            lab1/set/Set.cpp \
            lab1/vocabulary/Vocabulary.cpp \
            lab1/set/parser.cpp

      - name: Build application
        run: make -C lab1 clean main

      - name: Prepare release package
        run: |
          mkdir -p package
          cp lab1/main package/ppoiss-lab1
          chmod +x package/ppoiss-lab1

          if [ -f lab1/dictionary.txt ]; then
            cp lab1/dictionary.txt package/
          fi

          printf '%s\n' \
            'PPOIS Laboratory 1' \
            'Target platform: Linux x86_64' \
            'Run: ./ppoiss-lab1' \
            > package/README.txt

          tar -czf PPOIS-lab1-linux-x86_64.tar.gz -C package .

      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/lab1-v')
        uses: actions/upload-artifact@v4
        with:
          name: lab1-release-package
          path: PPOIS-lab1-linux-x86_64.tar.gz
          if-no-files-found: error



  # 2 лаба
  lab2-checks:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgtest-dev \
            cppcheck \
            gcovr

      - name: Configure CMake
        run: |
          cmake -S lab2 -B lab2/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DENABLE_COVERAGE=ON

      - name: Build application and tests
        run: cmake --build lab2/build --parallel 2

      - name: Run tests and generate coverage report
        run: cmake --build lab2/build --target coverage_report

      - name: Check coverage threshold
        run: cmake --build lab2/build --target coverage_check

      - name: Static analysis
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --language=c++ \
            --std=c++17 \
            --suppress=missingIncludeSystem \
            -I lab2/include \
            lab2/main.cpp \
            lab2/src

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab2-coverage-report
          path: |
            lab2/build/coverage.html
            lab2/build/coverage.xml
          if-no-files-found: ignore

  #релизы
  release:
    if: startsWith(github.ref, 'refs/tags/lab1-v')
    needs: lab1-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: lab1-release-package
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Лабораторная 1 — ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/PPOIS-lab1-linux-x86_64.tar.gz

