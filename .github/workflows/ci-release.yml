
name: CI and Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "lab1-v*"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cppcheck

      - name: Run unit tests
        run: make -C lab1 test

      - name: Check test coverage
        run: make -C lab1 coverage

      - name: Static analysis
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --language=c++ \
            --std=c++17 \
            --suppress=missingIncludeSystem \
            -I lab1 \
            lab1/main.cpp \
            lab1/Set.cpp \
            lab1/Vocabulary.cpp \
            lab1/parser.cpp

      - name: Build application
        run: make -C lab1 clean main

      - name: Prepare release package
        run: |
          mkdir -p package
          cp lab1/main package/ppoiss-lab1
          chmod +x package/ppoiss-lab1

          if [ -f lab1/dictionary.txt ]; then
            cp lab1/dictionary.txt package/
          fi

          printf '%s\n' \
            'PPOIS Laboratory 1' \
            'Target platform: Linux x86_64' \
            'Run: ./ppoiss-lab1' \
            > package/README.txt

          tar -czf PPOIS-lab1-linux-x86_64.tar.gz -C package .

      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/lab1-v')
        uses: actions/upload-artifact@v4
        with:
          name: lab1-release-package
          path: PPOIS-lab1-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/lab1-v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: lab1-release-package
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Лабораторная 1 — ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/PPOIS-lab1-linux-x86_64.tar.gz

