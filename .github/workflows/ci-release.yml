
name: CI and Release

on:
  pull_request:
    branches:
      - main

  push:
    tags:
      - "lab1-v*"
      - "lab2-v*"
      - "lab3-v*"

permissions:
  contents: read

jobs:
  # Лабораторная работа №1
  lab1-checks:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/lab1-v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cppcheck gcovr

      - name: Run unit tests
        run: make -C lab1 test

      - name: Check test coverage
        run: make -C lab1 coverage

      - name: Static analysis
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --language=c++ \
            --std=c++17 \
            --suppress=missingIncludeSystem \
            -I lab1 \
            lab1/main.cpp \
            lab1/set/Set.cpp \
            lab1/vocabulary/Vocabulary.cpp \
            lab1/set/parser.cpp

      - name: Build application
        run: make -C lab1 clean main

      - name: Prepare release package
        run: |
          mkdir -p package
          cp lab1/main package/ppoiss-lab1
          chmod +x package/ppoiss-lab1

          if [ -f lab1/dictionary.txt ]; then
            cp lab1/dictionary.txt package/
          fi

          printf '%s\n' \
            'PPOIS Laboratory 1' \
            'Target platform: Linux x86_64' \
            'Run: ./ppoiss-lab1' \
            > package/README.txt

          tar -czf PPOIS-lab1-linux-x86_64.tar.gz -C package .

      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/lab1-v')
        uses: actions/upload-artifact@v4
        with:
          name: lab1-release-package
          path: PPOIS-lab1-linux-x86_64.tar.gz
          if-no-files-found: error

  # Лабораторная работа №2
  lab2-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgtest-dev \
            cppcheck \
            gcovr

      - name: Clean CMake build directory
        run: rm -rf lab2/build

      - name: Configure CMake
        run: |
          cmake -S lab2 -B lab2/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DENABLE_COVERAGE=ON

      - name: Build application and tests
        run: cmake --build lab2/build --parallel 2

      - name: Run tests and generate coverage report
        run: cmake --build lab2/build --target coverage_report

      - name: Check coverage threshold
        run: cmake --build lab2/build --target coverage_check

      - name: Static analysis
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --language=c++ \
            --std=c++17 \
            --suppress=missingIncludeSystem \
            -I lab2/include \
            lab2/main.cpp \
            lab2/src

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab2-coverage-report
          path: |
            lab2/build/coverage.html
            lab2/build/coverage.xml
          if-no-files-found: ignore

  # Лабораторная работа №3
  lab3-checks:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/lab3-v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            cppcheck \
            python3

      - name: Clean CMake build directory
        run: |
          rm -rf lab3/build
          rm -rf lab3/build-coverage

      - name: Configure CMake
        run: |
          cmake -S lab3 -B lab3/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build application and tests
        run: cmake --build lab3/build --parallel 2

      - name: Run tests and check coverage
        run: cmake --build lab3/build --target coverage --parallel 2

      - name: Static analysis
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --language=c++ \
            --std=c++17 \
            --suppress=missingIncludeSystem \
            --project=lab3/build/compile_commands.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab3-coverage-report
          path: lab3/build/coverage-summary.txt
          if-no-files-found: ignore

  # Релиз лабораторной работы №1
  release:
    if: startsWith(github.ref, 'refs/tags/lab1-v')
    needs: lab1-checks
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: lab1-release-package
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Лабораторная 1 — ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/PPOIS-lab1-linux-x86_64.tar.gz

  # Релиз лабораторной работы №2
  release-lab2:
    name: Release Lab2
    if: startsWith(github.ref, 'refs/tags/lab2-v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgtest-dev

      - name: Clean CMake build directory
        run: rm -rf lab2/build

      - name: Configure CMake
        run: |
          cmake -S lab2 -B lab2/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build application and tests
        run: cmake --build lab2/build --parallel 2

      - name: Run tests
        run: ctest --test-dir lab2/build --output-on-failure

      - name: Prepare release package
        run: |
          mkdir -p dist/package

          cp lab2/build/dekanat_app dist/package/ppoiss-lab2
          chmod +x dist/package/ppoiss-lab2

          cat > dist/package/README.txt << 'EOF'
          PPOIS Laboratory 2 — Dekanat
          Target platform: Linux x86_64

          Run:
            ./ppoiss-lab2
          EOF

          tar -czf "dist/PPOIS-lab2-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            -C dist/package .

      - name: Prepare source archive
        run: |
          tar \
            --exclude='lab2/build' \
            --exclude='lab2/coverage*' \
            -czf "dist/PPOIS-lab2-${GITHUB_REF_NAME}-source.tar.gz" \
            lab2 README.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Лабораторная 2 — ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*.tar.gz

  # Релиз лабораторной работы №3
  release-lab3:
    name: Release Lab3
    if: startsWith(github.ref, 'refs/tags/lab3-v')
    needs: lab3-checks
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake

      - name: Clean CMake build directory
        run: |
          rm -rf lab3/build
          rm -rf lab3/build-coverage

      - name: Configure CMake
        run: |
          cmake -S lab3 -B lab3/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build application and tests
        run: cmake --build lab3/build --parallel 2

      - name: Run tests
        run: ctest --test-dir lab3/build --output-on-failure

      - name: Prepare release package
        run: |
          mkdir -p dist/package
          mkdir -p dist/package/data/demo
          cp -a lab3/data/demo/. dist/package/data/demo/
          cp lab3/build/warehouse_app dist/package/ppoiss-lab3
          chmod +x dist/package/ppoiss-lab3

          cat > dist/package/README.txt << 'EOF'
          PPOIS Laboratory 3 — Warehouse Management
          Target platform: Linux x86_64

          Run:
            ./ppoiss-lab3
          EOF

          tar -czf "dist/PPOIS-lab3-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            -C dist/package .

      - name: Prepare source archive
        run: |
          tar \
            --exclude='lab3/build' \
            --exclude='lab3/build-*' \
            --exclude='lab3/coverage*' \
            -czf "dist/PPOIS-lab3-${GITHUB_REF_NAME}-source.tar.gz" \
            lab3 README.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Лаборатория 3 — ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/*.tar.gz

